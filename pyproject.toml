[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ur5-style-arm"
version = "0.1.0"
description = "Pinocchio and MuJoCo based 6DOF arm toolkit with standalone task environments"
requires-python = ">=3.10"
dependencies = [
  "dm_control",
  "dm_env",
  "h5py",
  "matplotlib",
  "mujoco>=3.2",
  "numpy>=1.26",
  "opencv-python",
  "pyquaternion",
  "tqdm",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
packages = ["ur5_style_arm", "mujoco_control", "tasks"]
package-dir = {ur5_style_arm = "src/ur5_style_arm", mujoco_control = "mujoco_control", tasks = "tasks"}
